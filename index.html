<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Liga Positiva</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #0f172a; /* slate-900 */
        min-height: 100vh;
        width: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        z-index: 9999;
        padding: 20px;
        box-sizing: border-box;
      }
      .loader-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background-color: #1e293b; /* slate-800 */
        margin-bottom: 24px;
        animation: pulse 1.5s infinite ease-in-out;
      }
      .loader-bar {
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background-color: #1e293b;
        overflow: hidden;
        position: relative;
      }
      .loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        background-color: #10b981; /* emerald-500 */
        border-radius: 4px;
        animation: slide 1.2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes slide {
        0% { left: -50%; }
        100% { left: 100%; }
      }

      /* Auto-recovery card styles */
      .loader-fallback {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-top: 28px;
        max-width: 340px;
        width: 100%;
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .loader-fallback-text {
        font-size: 13px;
        color: #94a3b8; /* slate-400 */
        line-height: 1.5;
        margin: 0 0 16px 0;
      }
      .loader-fallback-error {
        display: none;
        font-size: 11px;
        color: #f87171; /* red-400 */
        background-color: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 16px;
        word-break: break-word;
        font-family: monospace;
        max-width: 100%;
        box-sizing: border-box;
      }
      .loader-fallback-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
      .btn-clear-cache {
        background-color: #10b981; /* emerald-500 */
        color: #022c22; /* emerald-950 */
        border: none;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      }
      .btn-clear-cache:hover {
        background-color: #059669;
        color: #ffffff;
      }
      .btn-clear-cache:active {
        transform: scale(0.97);
      }
      .btn-retry {
        background-color: transparent;
        color: #cbd5e1; /* slate-300 */
        border: 1px solid #334155; /* slate-700 */
        padding: 10px 16px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-retry:hover {
        background-color: #1e293b;
        color: #ffffff;
      }
      .btn-retry:active {
        transform: scale(0.97);
      }
      .loader-fallback-help {
        font-size: 11px;
        color: #64748b; /* slate-500 */
        margin-top: 14px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initialLoader">
        <div class="loader-logo"></div>
        <div class="loader-bar"></div>
        
        <!-- Auto-recovery panel if script hangs or fails -->
        <div id="loaderFallback" class="loader-fallback">
          <p class="loader-fallback-text" id="loaderFallbackMsg">
            O aplicativo está demorando mais do que o normal para iniciar...
          </p>
          <div id="loaderFallbackError" class="loader-fallback-error"></div>
          <div class="loader-fallback-actions">
            <button type="button" class="btn-clear-cache" id="btnClearCache">
              Limpar Cache e Recarregar
            </button>
            <button type="button" class="btn-retry" onclick="window.location.reload()">
              Tentar Novamente
            </button>
          </div>
          <p class="loader-fallback-help">
            Dica: abra diretamente no Safari ou Chrome e evite abrir por dentro do WhatsApp.
          </p>
        </div>
      </div>
    </div>

    <script>
      (function() {
        var fallbackEl = document.getElementById('loaderFallback');
        var fallbackMsg = document.getElementById('loaderFallbackMsg');
        var fallbackErr = document.getElementById('loaderFallbackError');
        var btnClear = document.getElementById('btnClearCache');
        var timeoutFired = false;

        function showRecoveryUI(message, detail) {
          if (window.__REACT_MOUNTED__) return;
          if (fallbackEl) {
            fallbackEl.style.display = 'flex';
          }
          if (message && fallbackMsg) {
            fallbackMsg.innerText = message;
          }
          if (detail && fallbackErr) {
            fallbackErr.style.display = 'block';
            fallbackErr.innerText = detail;
          }
        }

        // 1. Timeout de 6 segundos caso o download ou execução do JS trave
        setTimeout(function() {
          if (!window.__REACT_MOUNTED__) {
            timeoutFired = true;
            showRecoveryUI('O aplicativo está demorando para responder. Pode haver uma versão antiga em cache no seu aparelho.');
          }
        }, 6000);

        // 2. Captura de erro global de script ou carregamento de módulo antes do React montar
        window.addEventListener('error', function(event) {
          if (!window.__REACT_MOUNTED__) {
            console.error('[StartupError] Erro capturado no carregamento:', event);
            var errDetail = event.message || (event.error && event.error.message) || 'Erro ao carregar arquivos do app.';
            showRecoveryUI(
              'Ocorreu um erro ao carregar o aplicativo no seu navegador.',
              errDetail
            );
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (!window.__REACT_MOUNTED__) {
            console.warn('[StartupError] Promise rejeitada no carregamento:', event.reason);
            var reasonMsg = (event.reason && (event.reason.message || event.reason.toString())) || '';
            if (reasonMsg) {
              showRecoveryUI(
                'Falha de inicialização detectada.',
                reasonMsg
              );
            }
          }
        });

        // 3. Ação de auto-recuperação (Limpar Cache e Recarregar)
        if (btnClear) {
          btnClear.addEventListener('click', async function() {
            btnClear.innerText = 'Limpando dados...';
            btnClear.style.opacity = '0.7';
            btnClear.disabled = true;

            try {
              // Limpa todos os Service Workers registrados
              if ('serviceWorker' in navigator) {
                var registrations = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < registrations.length; i++) {
                  await registrations[i].unregister();
                }
              }
              // Limpa todos os caches de arquivos
              if ('caches' in window) {
                var cacheKeys = await caches.keys();
                for (var j = 0; j < cacheKeys.length; j++) {
                  await caches.delete(cacheKeys[j]);
                }
              }
              // Limpa sessionStorage
              try {
                sessionStorage.clear();
              } catch (e) {}
            } catch (err) {
              console.error('Erro ao limpar cache:', err);
            }

            // Recarrega forçando novo timestamp na URL
            var cleanUrl = window.location.origin + window.location.pathname + '?v=' + Date.now();
            window.location.replace(cleanUrl);
          });
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
